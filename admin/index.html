<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>算栗工坊 · 内容管理</title>
  <link rel="icon" href="../assets/chestnut.png" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #nc-root { min-height: 100vh; }
  </style>
  <!-- Boot 脚本：在 CMS 加载前，把回调带回的 token 写入 localStorage（绕过弹窗 opener 丢失问题）-->
  <script>
    (function () {
      // token 放在 URL fragment：不会发送给 Netlify，也不会出现在 Referer 中。
      // 保留 query 读取，只为兼容曾经的旧回调链接。
      var p = new URLSearchParams(location.search);
      var h = new URLSearchParams(location.hash.slice(1));
      var token = h.get('token') || p.get('token');
      if (token) {
        // Decap CMS 3.x 期望的 localStorage 形状与键名。
        // 注意：旧版 Netlify CMS 使用 netlify-cms-user；当前 Decap CMS 使用 decap-cms-user。
        localStorage.setItem('decap-cms-user', JSON.stringify({ token: token, backendName: 'github' }));
        // 清掉 URL 上的 token，避免泄露/重复
        history.replaceState(null, '', location.pathname);
      }
    })();
  </script>
</head>
<body>
  <div id="nc-root"></div>
  <script src="./decap-cms.js"></script>
</body>
</html>
