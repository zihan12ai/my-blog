# Netlify 配置 —— 算栗工坊
# 构建全交给 Netlify（不再用 GitHub Action，避免重复）
[build]
  command = "python scripts/build.py"
  publish = "docs"

# JSON 正确 content-type
[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/assets/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

