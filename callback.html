<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>登录中… · 算栗工坊</title>
</head>
<body>
  <p>正在完成登录…</p>
  <script>
    // Decap CMS GitHub OAuth 回调：把结果传回 admin 窗口
    (function () {
      if (window.opener) {
        window.opener.postMessage(
          'authorization:github:success',
          { content: JSON.stringify({ token: location.hash || location.search }) }
        );
      }
      // 简单回退：直接跳回 admin
      setTimeout(function () { location.href = './admin/'; }, 1500);
    })();
  </script>
</body>
</html>
